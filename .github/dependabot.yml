# Keeps the SHA-pinned GitHub Actions current. Python dependencies are pinned in uv.lock
# and audited weekly by CI (pip-audit); they are upgraded deliberately, with an evaluation
# run, rather than by automated pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  # The web interface's packages, grouped into one pull request.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
    commit-message:
      prefix: build
  # The image's base (python:3.12-slim) and the uv image it copies from.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: build
