# Keeps the SHA-pinned GitHub Actions current. Python dependencies are pinned in uv.lock
# and audited weekly by CI (pip-audit); they are upgraded deliberately, with an evaluation
# run, rather than by automated pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
