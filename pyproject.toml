[project]
name = "production-rag"
version = "0.1.0"
description = "A production-oriented Retrieval-Augmented Generation backend with grounded, cited answers and evaluation gates."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "anthropic>=2.0",  # 2.x sends API version 2026-10-21, which this code targets
    "fastapi>=0.115",
    "numpy>=2.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=5.1",
    "python-multipart>=0.0.18",
    "sqlalchemy>=2.0.36",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# Semantic embeddings via ONNX models (downloaded from Hugging Face on first use).
local-embeddings = ["fastembed>=0.4"]

[project.scripts]
rag = "production_rag.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/production_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: calls external services (Anthropic API, model downloads); skipped unless RAG_RUN_LIVE_TESTS=1",
]
filterwarnings = ["error::DeprecationWarning:production_rag.*"]

[tool.coverage.run]
source = ["production_rag"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PTH", "C4"]
ignore = ["S101"]  # assert is fine in tests and for invariants

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]
# Migrations build DDL from constant fragments; nothing user-controlled is interpolated.
"src/production_rag/db/migrations/**" = ["E501", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "pypdf.*"]
ignore_missing_imports = true
