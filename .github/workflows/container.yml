name: Container image

# Builds the image, runs it and checks it answers, scans it, then publishes it to the GitHub
# Container Registry: for every release tag, or by hand for an existing release
# (docs/release.md). Run by hand without a release, it builds, tests and scans the commit it
# runs on, as a check before tagging, and never publishes.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - Dockerfile
      - web/**
      - .dockerignore
      - .github/workflows/container.yml
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag whose source goes into the image, such as v1.0.0; empty builds this commit and never publishes"
        required: false
        default: ""
      publish:
        description: "Push the release's image to ghcr.io (otherwise build and test only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}-${{ inputs.release || '' }}
  cancel-in-progress: false

jobs:
  image:
    name: Build, test and publish the image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      TEST_TAG: production-rag:test
      PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.release != '') }}
      # A pull request, or a manual run without a release: this commit's source, unpublished.
      CANDIDATE: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.release == '') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # release tags, for a manual build of an earlier release

      - name: Use the release's source (manual runs)
        if: github.event_name == 'workflow_dispatch' && inputs.release != ''
        env:
          RELEASE: ${{ inputs.release }} # via env, never spliced into the script
        run: |
          git rev-parse --verify --quiet "refs/tags/${RELEASE}" >/dev/null \
            || { echo "::error::${RELEASE} is not a tag of this repository"; exit 1; }
          # The image's code is exactly the release's; the Dockerfile and this workflow are current.
          # Removed first: a checkout of the tag's files alone would leave files added since.
          git rm -r -q --cached src && rm -rf src
          git checkout "${RELEASE}" -- src pyproject.toml uv.lock README.md LICENSE
          # The release's own web interface, if it had one; older releases ignore the current one.
          if git cat-file -e "${RELEASE}:web" 2>/dev/null; then
            git rm -r -q --cached web && rm -rf web && git checkout "${RELEASE}" -- web
          fi

      - name: Version and labels
        id: version
        env:
          RELEASE: ${{ inputs.release || github.ref_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "$CANDIDATE" != true ]; then
            [ "v${version}" = "${RELEASE}" ] \
              || { echo "::error::pyproject.toml says ${version}, the tag is ${RELEASE}"; exit 1; }
            echo "revision=$(git rev-parse "${RELEASE}^{commit}")" >> "$GITHUB_OUTPUT"
          else
            echo "revision=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.version.outputs.revision }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image for testing
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.TEST_TAG }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Test the image (offline configuration)
        run: |
          set -euo pipefail
          url=http://127.0.0.1:8000
          json() { python3 -c "import json, sys; print(json.load(sys.stdin)$1)"; }
          docker run -d --name rag -p 8000:8000 "$TEST_TAG"
          trap 'docker logs rag; docker rm -f rag >/dev/null' EXIT
          for _ in $(seq 60); do curl -fsS "$url/ready" >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS "$url/ready"; echo
          [ "$(docker exec rag id -u)" = "10001" ] || { echo "::error::runs as root"; exit 1; }
          doc=$(curl -fsS -F "file=@eval/corpus/deployment-runbook.md" "$url/v1/documents" | json "['document']['id']")
          for _ in $(seq 60); do
            status=$(curl -fsS "$url/v1/documents/$doc" | json "['status']")
            [ "$status" = ready ] && break
            [ "$status" = failed ] && { echo "::error::ingestion failed"; exit 1; }
            sleep 1
          done
          [ "$status" = ready ] || { echo "::error::ingestion did not finish"; exit 1; }
          question='{"question": "How long does the canary run?"}'
          curl -fsS "$url/v1/query" -H "Content-Type: application/json" -d "$question" \
            | python3 -c "import json, sys; a = json.load(sys.stdin); assert a['status'] == 'answered' and a['citations'], a; print(a['answer'])"
          curl -fsSN "$url/v1/query/stream" -H "Content-Type: application/json" -d "$question" \
            | grep -q '^event: done' || { echo "::error::no streamed answer"; exit 1; }
          if [ -f src/production_rag/metrics.py ]; then # releases before 0.3 have no /metrics
            curl -fsS "$url/metrics" | grep -q '^rag_documents{status="ready"} 1.0$' \
              || { echo "::error::/metrics does not report the document"; exit 1; }
          fi
          if [ -f src/production_rag/api/web.py ]; then # releases before 0.3 serve no interface
            curl -fsS "$url/" | grep -q '<div id="root">' \
              || { echo "::error::the web interface is not served at /"; exit 1; }
            script=$(curl -fsS "$url/" | grep -o '/assets/[^"]*\.js' | head -1)
            curl -fsS -o /dev/null "$url$script" \
              || { echo "::error::the web interface's script is not served"; exit 1; }
          fi
          if [ -f src/production_rag/db/maintenance.py ]; then # releases before 0.3 have no backups
            backup=$(docker exec rag rag db backup | json "['backup']")
            docker exec rag rag db verify --file "$backup" >/dev/null \
              || { echo "::error::the online backup failed verification"; exit 1; }
          fi
          echo "image works: ready, ingests, answers with citations, streams, metrics, backups, web, non-root"

      # Fails on a critical or high vulnerability that has a fix. To accept one, add its id
      # to .trivyignore with the reason (docs/security.md).
      - name: Scan the image for known vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TEST_TAG }}
          # Vulnerabilities only: the secret scanner flags example keys in dependencies'
          # docstrings, and the repository's own secrets are gitleaks' job.
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Everything the scanner knows of, at every severity, fixed or not: what the gate above
      # lets through. Every input is set here, so nothing carries over from the gate's step.
      - name: Full vulnerability report
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TEST_TAG }}
          scanners: vuln
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"
          format: json
          output: image-vulnerabilities.json

      - name: Summarize the report
        if: always() && hashFiles('image-vulnerabilities.json') != ''
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          from collections import Counter
          report = json.load(open("image-vulnerabilities.json"))
          found = [v for r in report.get("Results", []) for v in r.get("Vulnerabilities") or []]
          order = ["CRITICAL", "HIGH", "MEDIUM", "LOW", "UNKNOWN"]
          fixed = Counter(v["Severity"] for v in found if v.get("FixedVersion"))
          unfixed = Counter(v["Severity"] for v in found if not v.get("FixedVersion"))
          print("## Image vulnerabilities\n")
          print("| Severity | With a fix | Without a fix |")
          print("| --- | --- | --- |")
          for severity in order:
              print(f"| {severity} | {fixed[severity]} | {unfixed[severity]} |")
          serious = [v for v in found if v["Severity"] in ("CRITICAL", "HIGH")]
          if serious:
              print("\n| Id | Package | Installed | Fixed in | Severity |")
              print("| --- | --- | --- | --- | --- |")
              for v in sorted(serious, key=lambda v: (order.index(v["Severity"]), v["VulnerabilityID"])):
                  print(f"| {v['VulnerabilityID']} | {v['PkgName']} | {v['InstalledVersion']} "
                        f"| {v.get('FixedVersion') or 'no fix yet'} | {v['Severity']} |")
          PY

      - name: Upload the report
        if: always() && hashFiles('image-vulnerabilities.json') != ''
        uses: actions/upload-artifact@v7
        with:
          name: image-vulnerabilities
          path: image-vulnerabilities.json

      - name: Log in to the GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true # an SPDX bill of materials, attached to the image
          provenance: mode=max # how, from what and by which workflow it was built
