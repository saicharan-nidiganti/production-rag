name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly, so newly published vulnerabilities surface without a push
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests, eval gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      # Each step is a Makefile target, so developers run exactly what CI runs.
      - name: Check that uv.lock matches pyproject.toml
        run: make lock-check

      - name: Install
        run: make install

      - name: Lint
        run: make lint

      - name: Type check
        run: make typecheck

      - name: Tests (offline; live and paid tests are skipped)
        run: make test

      - name: Retrieval regression gate
        run: make eval-gate

      - name: Smoke test (real server over HTTP)
        run: make smoke

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report-py${{ matrix.python-version }}
          path: eval/reports/
          if-no-files-found: ignore

  performance:
    name: Performance benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12" # the baseline in eval/bench/ was recorded with 3.12
          enable-cache: true

      - name: Install
        run: make install

      # Exit 1: a limit or a regression rule failed. Exit 3: the benchmark couldn't run.
      - name: Benchmark (10,000 chunks, offline configuration)
        run: make bench

      - name: Show the report on the run page
        if: always()
        run: cat eval/reports/bench/benchmark.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: eval/reports/bench/
          if-no-files-found: ignore

  package:
    name: Build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12" # the oldest supported version
          enable-cache: true

      - name: Build sdist and wheel; run the CLI from the installed wheel alone
        run: make package

  security:
    name: Secret scan and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the commits in the pushed range

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      - name: Dependency audit (pip-audit against the locked versions)
        run: |
          uv export --frozen --all-extras --all-groups --no-hashes --no-emit-project \
            --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps --strict

  postgres:
    name: Tests and retrieval gate on PostgreSQL (pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
        env:
          POSTGRES_USER: rag
          POSTGRES_DB: rag
          POSTGRES_HOST_AUTH_METHOD: trust # a throwaway server, reachable only by this job
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag" --health-interval 5s --health-timeout 5s
          --health-retries 12
    env:
      # Each test creates its own database on this server and drops it afterwards.
      RAG_TEST_POSTGRES_URL: postgresql+pg8000://rag@127.0.0.1:5432/rag
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: make install

      # Tests of SQLite itself (file backups, FTS5) are skipped; everything else runs here.
      - name: Tests against PostgreSQL
        run: uv run python -m pytest -q

      - name: Retrieval regression gate on PostgreSQL
        env:
          RAG_DATABASE_URL: postgresql+pg8000://rag@127.0.0.1:5432/rag
          RAG_EMBEDDING_PROVIDER: hashing
          RAG_RERANKER: none
        run: uv run rag eval --thresholds eval/thresholds.json

  web:
    name: Web interface (lint, types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Lint (ESLint with accessibility rules), types, tests, build
        run: npm run check

      - name: Audit the dependencies that ship to the browser
        run: npm audit --omit=dev

  docs:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
