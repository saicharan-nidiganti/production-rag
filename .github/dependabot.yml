# Keeps the SHA-pinned GitHub Actions current. Python dependencies are pinned in uv.lock
# and audited weekly by CI (pip-audit); they are upgraded deliberately, with an evaluation
# run, rather than by automated pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  # The web interface's packages, grouped into one pull request.
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: monthly
    groups:
      web:
        patterns: ["*"]
    # eslint-plugin-jsx-a11y supports ESLint up to 9; take ESLint 10 when it supports that.
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
  # The image's base (python:3.12-slim) and the uv image it copies from.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    # The Python and Node lines are chosen on purpose (CI tests them); only take patches.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    commit-message:
      prefix: build
