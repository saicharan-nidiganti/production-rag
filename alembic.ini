# Alembic configuration for running migrations with the `alembic` CLI directly.
# The database URL comes from RAG_DATABASE_URL (see production_rag.config) unless
# sqlalchemy.url is set here. `rag db upgrade` is the usual entry point.

[alembic]
script_location = %(here)s/src/production_rag/db/migrations
prepend_sys_path = src
path_separator = os
